name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: Unit tests (tokenizer, sampler, safetensors streaming, chat template)
        run: npm run test:unit
      - name: GPU tests (WGSL kernels + parity with transformers, on SwiftShader)
        run: npm run test:gpu
